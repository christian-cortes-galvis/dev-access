<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CortexDev · Acceso a copias</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<link rel="apple-touch-icon" href="/favicon.png">
	<script src="/theme.js?v=3"></script>
	<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
	<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="/style.css?v=4">
	<script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
</head>

<body>
	<div class="login-wrap">
		<div class="login-card">
			<div class="login-brand">
				<div class="logo"><img src="/favicon.png" alt="CortexDev"></div>
				<div>
					<h1 class="h5 mb-0">Copias de seguridad</h1>
					<p class="small text-body-secondary mb-0">copias.cortexdev.win</p>
				</div>
			</div>

			<div class="card">
				<div class="card-body p-4">
					<div id="login-error" class="alert alert-danger d-flex align-items-start gap-2" hidden>
						<i class="fa-solid fa-triangle-exclamation mt-1"></i><span id="login-error-text"></span>
					</div>
					<form id="login-form">
						<div class="mb-3">
							<label class="form-label" for="username">Usuario</label>
							<input class="form-control" id="username" autocomplete="username" required autofocus>
						</div>
						<div class="mb-3">
							<label class="form-label" for="password">Contraseña</label>
							<input type="password" class="form-control" id="password" autocomplete="current-password" required>
						</div>
						<button type="submit" class="btn btn-primary w-100">
							<i class="fa-solid fa-right-to-bracket"></i><span>Entrar</span></button>
					</form>
				</div>
			</div>
			<p class="small text-body-secondary text-center mt-3 mb-0">
				Acceso restringido · ubuntu-services
			</p>
		</div>
	</div>

	<script>
		(function () {
			'use strict';
			var form = document.getElementById('login-form');
			var errorBox = document.getElementById('login-error');
			form.addEventListener('submit', async function (event) {
				event.preventDefault();
				errorBox.hidden = true;
				try {
					var res = await fetch('/api/auth/login', {
						method: 'POST',
						credentials: 'same-origin',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							username: document.getElementById('username').value,
							password: document.getElementById('password').value
						})
					});
					var text = await res.text();
					var data = null;
					try { data = text ? JSON.parse(text) : null; } catch (e) {}
					if (!res.ok) {
						throw new Error((data && data.detail) || ('HTTP ' + res.status));
					}
					location.href = '/';
				} catch (err) {
					document.getElementById('login-error-text').textContent = 'No se pudo entrar: ' + err.message;
					errorBox.hidden = false;
				}
			});
		})();
	</script>
</body>

</html>
