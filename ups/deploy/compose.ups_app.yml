# Servicio a ANADIR dentro de ~/cortexdev-access/docker-compose.yml (bajo `services:`).
# No reemplaza el archivo: pegar este bloque y conservar el resto tal cual.
#
# Notas:
# - context ./ups  -> la carpeta ups/ que se copia junto a este deploy/.
# - volumes ./ups/data:/data -> bind mount para el SQLite (gitignored) y facil migracion.
# - ports 127.0.0.1:8484 -> solo loopback; lo consume el nginx de acceso (host network).

  ups_app:
    container_name: ups_app
    mem_limit: 128m
    build:
      context: ./ups
      dockerfile: Dockerfile
    environment:
      UPS_HOST: "192.168.0.224"
      UPS_NAME: "apc"
      POLL_INTERVAL: "30"
      DB_PATH: "/data/ups.db"
      SIMULATE: "0"
      HTTP_FALLBACK: "1"
    volumes:
      - ./ups/data:/data
    ports:
      - "127.0.0.1:8484:8484"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8484/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
