# Vhost de la UPS para el nginx de la CAPA DE ACCESO (ubuntu-services, .49).
# Copiar a: ~/cortexdev-access/nginx/conf.d/ups.conf
#
# TLS: se hereda del snippet comun (tls-win.conf), igual que index.conf.
# El nginx de acceso corre con network_mode: host, por eso el upstream es 127.0.0.1
# (ups_app publica 127.0.0.1:8484 en el host).

server {
    listen 80;
    server_name ups.cortexdev.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ups.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;

    # upsset.cgi (escritura) bloqueado, incluidas variantes con PATH_INFO
    location ~ ^/cgi-bin/nut/upsset\.cgi {
        return 403;
    }

    # NUT clasico (Apache/upsstats.cgi en la PVE .224)
    location /cgi-bin/nut/ {
        proxy_pass http://192.168.0.224:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Dashboard propio (mismo origen: /api y /api/ws relativos funcionan igual)
    location / {
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/api/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
