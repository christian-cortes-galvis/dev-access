# ---------------------------------------------------------------------------
# Dashboards de infraestructura — capa de acceso en ubuntu-services
#
# Sirve pihole, proxmox, backups/pbs, uptime/kuma y netdata-* desde
# 192.168.0.49 para que sigan accesibles aunque ubuntu-docker este apagado.
# Pi-hole escucha en 127.0.0.1:8443 (su UI se movio de 443 a 8443 en el host).
#
# Cada servicio tiene un server block .lan (cert mkcert) y otro .win (cert
# publico Let's Encrypt), porque nginx no elige entre dos certs RSA del mismo
# tipo en un solo bloque. El cuerpo de cada uno se comparte via snippets/.
# ---------------------------------------------------------------------------

# Redireccion HTTP -> HTTPS de los dashboards
server {
    listen 80;
    server_name pihole.cortexdev.lan pihole.cortexdev.win proxmox.cortexdev.lan proxmox.cortexdev.win backups.cortexdev.lan backups.cortexdev.win pbs.cortexdev.lan pbs.cortexdev.win uptime.cortexdev.lan uptime.cortexdev.win kuma.cortexdev.lan kuma.cortexdev.win netdata-services.cortexdev.lan netdata-services.cortexdev.win netdata-docker.cortexdev.lan netdata-docker.cortexdev.win netdata-backups.cortexdev.lan netdata-backups.cortexdev.win netdata-proxmox.cortexdev.lan netdata-proxmox.cortexdev.win;
    return 301 https://$host$request_uri;
}

# ------------------------------- Pi-hole -----------------------------------
server {
    listen 443 ssl;
    server_name pihole.cortexdev.lan;
    include /etc/nginx/conf.d/snippets/tls-lan.conf;
    include /etc/nginx/conf.d/snippets/pihole-body.conf;
}

server {
    listen 443 ssl;
    server_name pihole.cortexdev.win;
    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/pihole-body.conf;
}

