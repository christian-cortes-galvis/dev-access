# ---------------------------------------------------------------------------
# Dashboards de infraestructura — capa de acceso en ubuntu-services
#
# Sirve pihole, proxmox, backups/pbs, uptime/kuma y netdata-* desde
# 192.168.0.49 para que sigan accesibles aunque ubuntu-docker este apagado.
# Pi-hole escucha en 127.0.0.1:8443 (su UI se movio de 443 a 8443 en el host).
# ---------------------------------------------------------------------------

# Redireccion HTTP -> HTTPS de los dashboards
server {
    listen 80;
    server_name pihole.cortexdev.lan proxmox.cortexdev.lan backups.cortexdev.lan pbs.cortexdev.lan uptime.cortexdev.lan kuma.cortexdev.lan netdata-services.cortexdev.lan netdata-docker.cortexdev.lan netdata-backups.cortexdev.lan netdata-proxmox.cortexdev.lan;
    return 301 https://$host$request_uri;
}

# ------------------------------- Pi-hole -----------------------------------
server {
    listen 443 ssl;
    server_name pihole.cortexdev.lan;

    ssl_certificate     /etc/nginx/certs/cortexdev.lan/cortexdev.lan.pem;
    ssl_certificate_key /etc/nginx/certs/cortexdev.lan/cortexdev.lan-key.pem;

    # La UI vive en /admin, pero la API v6 responde en /api/
    location = / {
        return 302 /admin/;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / telemetria en vivo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ------------------------------- Proxmox VE --------------------------------
server {
    listen 443 ssl;
    server_name proxmox.cortexdev.lan;

    ssl_certificate     /etc/nginx/certs/cortexdev.lan/cortexdev.lan.pem;
    ssl_certificate_key /etc/nginx/certs/cortexdev.lan/cortexdev.lan-key.pem;

    # Subidas grandes (ISO, backups, plantillas)
    client_max_body_size 0;

    location / {
        proxy_pass https://192.168.0.224:8006;
