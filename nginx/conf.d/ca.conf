# ---------------------------------------------------------------------------
# Descarga de la CA local de mkcert (ca.cortexdev.lan / ca.cortexdev.win)
#
# Los equipos que aun no confien en la CA pueden descargarla en
# http://ca.cortexdev.lan/ (solo HTTP, sin certificado) e instalarla una vez.
# Con el certificado publico, https://ca.cortexdev.win/ ya no avisa.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name ca.cortexdev.lan ca.cortexdev.win;

    include /etc/nginx/conf.d/snippets/ca-body.conf;
}

server {
    listen 443 ssl;
    server_name ca.cortexdev.lan;

    include /etc/nginx/conf.d/snippets/tls-lan.conf;
    include /etc/nginx/conf.d/snippets/ca-body.conf;
}

server {
    listen 443 ssl;
    server_name ca.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/ca-body.conf;
}
