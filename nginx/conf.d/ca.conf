# ---------------------------------------------------------------------------
# Descarga de la CA local de mkcert (ca.cortexdev.lan) — capa de acceso
#
# Los equipos que aun no confien en la CA pueden descargarla en
# http://ca.cortexdev.lan/ (solo HTTP, sin certificado) e instalarla una vez.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name ca.cortexdev.lan;

    location = / {
        return 302 /cortexdev-lan-ca.crt;
    }

    location = /cortexdev-lan-ca.crt {
        alias /etc/nginx/certs/cortexdev.lan/ca.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="cortexdev-lan-ca.crt"';
    }
}

server {
    listen 443 ssl;
    server_name ca.cortexdev.lan;

    ssl_certificate     /etc/nginx/certs/cortexdev.lan/cortexdev.lan.pem;
    ssl_certificate_key /etc/nginx/certs/cortexdev.lan/cortexdev.lan-key.pem;

    location = / {
        return 302 /cortexdev-lan-ca.crt;
    }

    location = /cortexdev-lan-ca.crt {
        alias /etc/nginx/certs/cortexdev.lan/ca.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="cortexdev-lan-ca.crt"';
    }
}
