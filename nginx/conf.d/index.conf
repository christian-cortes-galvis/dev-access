# ---------------------------------------------------------------------------
# Portal / indice interno (index.cortexdev.lan) — capa de acceso en ubuntu-services
#
# DNS: Pi-hole resuelve index.cortexdev.lan -> 192.168.0.49 (override sobre el
# wildcard *.cortexdev.lan, que apunta las apps a 192.168.0.87).
# TLS: wildcard local de mkcert (nginx/certs/cortexdev.lan).
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name index.cortexdev.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name index.cortexdev.lan;

    ssl_certificate     /etc/nginx/certs/cortexdev.lan/cortexdev.lan.pem;
    ssl_certificate_key /etc/nginx/certs/cortexdev.lan/cortexdev.lan-key.pem;

    root /var/www/portal;
    index index.html;

    # API del portal (catalogo + estado en vivo). Escucha solo en 127.0.0.1:8088.
    location /api/ {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
