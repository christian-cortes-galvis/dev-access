# ---------------------------------------------------------------------------
# Portal / indice interno (index.cortexdev.lan / index.cortexdev.win)
# Capa de acceso en ubuntu-services.
#
# DNS: Pi-hole resuelve index.cortexdev.lan y index.cortexdev.win -> 192.168.0.49
# (override sobre el wildcard *.cortexdev.lan, que apunta las apps a 192.168.0.87).
# TLS: un server block por nombre (nginx no elige entre dos certs del mismo tipo
# en un bloque): .lan con el wildcard de mkcert y .win con el wildcard publico
# de Let's Encrypt. Ambos comparten el cuerpo en snippets/.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name index.cortexdev.lan index.cortexdev.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name index.cortexdev.lan;

    include /etc/nginx/conf.d/snippets/tls-lan.conf;
    include /etc/nginx/conf.d/snippets/index-body.conf;
}

server {
    listen 443 ssl;
    server_name index.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/index-body.conf;
}
